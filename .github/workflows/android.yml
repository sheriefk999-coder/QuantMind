# Builds the Android APK and publishes it as the "android-latest" release,
# so it can be downloaded and installed straight from the phone.
name: Build Android app
on:
  push: { paths: ["android-app/**", ".github/workflows/android.yml"] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Build
        working-directory: android-app
        run: |
          npm install
          npx cap add android
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: QuantMind-apk, path: android-app/android/app/build/outputs/apk/debug/app-debug.apk }
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk QuantMind.apk
          gh release delete android-latest -y --cleanup-tag || true
          gh release create android-latest QuantMind.apk -t "QuantMind Android" -n "Latest build of the app."
