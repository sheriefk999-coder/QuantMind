# Commands from the Android app (pause / resume / research now / level).
name: QuantMind control
on:
  workflow_dispatch:
    inputs:
      action: { description: "pause | resume | research_now | level", required: true }
      level: { description: "1-3 (only for action=level)", required: false, default: "" }
      symbol: { description: "symbol (only for taken/skipped)", required: false, default: "" }
concurrency: { group: quantmind-state, cancel-in-progress: false }
permissions: { contents: write, actions: write }
jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git fetch origin state && git worktree add state origin/state
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      - name: Apply command
        working-directory: backend
        env: { QM_STATE_DIR: "${{ github.workspace }}/state", ACTION: "${{ inputs.action }}", LEVEL: "${{ inputs.level }}", SYMBOL: "${{ inputs.symbol }}" }
        run: |
          case "$ACTION" in
            pause) python -m quantmind.cli control --pause "from app" ;;
            resume) python -m quantmind.cli control --resume ;;
            research_now) python -m quantmind.cli control --research-now ;;
            level) [[ "$LEVEL" =~ ^[123]$ ]] && python -m quantmind.cli control --level "$LEVEL" ;;
            taken|skipped) [[ "$SYMBOL" =~ ^[A-Z0-9]{2,20}$ ]] && python -m quantmind.cli control --$ACTION "$SYMBOL" ;;
            *) echo "unknown action"; exit 1 ;;
          esac
      - working-directory: state
        run: |
          git config user.name "quantmind-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A && git commit -qm "control: ${{ inputs.action }}" && git push origin HEAD:state || true
      - name: Refresh snapshot now
        if: inputs.action != 'taken' && inputs.action != 'skipped'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run cycle.yml --repo ${{ github.repository }}
